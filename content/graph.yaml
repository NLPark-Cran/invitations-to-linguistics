# ============================================================
# graph.yaml — 「语言学总论」知识图谱数据（概念节点 + 关系边）
# 课程：杭州电子科技大学《英语语言学概论》知识图谱建设任务
# 第 1 组（陈镜宇、张朝阳 Zhang Zhaoyang）负责「语言学总论」章节
#
# 字段说明（v2 对齐张立飞老师《普通语言学核心概念图谱 1.0》概念卡片规格）：
#   nodes: id(唯一标识) en(英文术语，主标题) zh(中文术语，小字幕)
#          module(所属模块，用于筛选/着色) def_en/def_zh(核心定义，忠实教材表述)
#          example(例证) group(可选，对应课程小组章节) bridge(可选，通往 Part 3)
#          sup_en/sup_zh(上位概念) source(经典文献/理论来源)
#          debate_zh(争议与限制，可选) status(审核状态：待审核/已审核/有争议)
#          x/y(手工分区布局坐标，0-1 相对值)
#   edges: source/target(节点 id) type(关系类型) note(边注，可选)
#   关系类型词表（对齐老师规格六种，本图谱用到六种之五）：
#     composition  组成（整体 → 部分）
#     classification 分类（类别 → 成员）
#     opposition   对立（六对区分，视觉上需一眼可辨）
#     explanation  理论解释（人物/理论/学科立场 → 概念）
#     chapter      指向章节（本图谱 → 后续章节，由对应小组展开）
#     association  关联（跨模块的相关概念，非层级非对立）
#   预留：method 研究方法（总论章暂无边使用，词表保留以备扩展）
#   设计原则（老师规格）：定义、理论解释、经验实例、研究争议分开存储，
#   不将某一流派的定义误写成整个学科的唯一共识。
# ============================================================

meta:
  title_en: "General Linguistics · Invitation"
  title_zh: "语言学总论 · 交互式知识图谱"
  chapter: "Chapter 1 · Invitations to Linguistics"
  authors: "Chen Jingyu & Zhang Zhaoyang (Group 1)"

modules:
  core:        { en: "Core",            zh: "核心概念" }
  features:    { en: "Design Features", zh: "识别特征" }
  functions:   { en: "Functions",       zh: "语言功能" }
  branches:    { en: "Branches",        zh: "学科分支" }
  distinctions: { en: "Distinctions",   zh: "重要区分" }
  people:      { en: "Theorists",       zh: "理论人物" }

nodes:
  # ---------- 核心 ----------
  - id: language
    en: "Language"
    zh: "语言"
    module: core
    def_en: "Language is a system of arbitrary vocal symbols used for human communication."
    def_zh: "语言是用于人类交际的、任意的有声符号系统。"
    example: "Four keywords: system · arbitrary · vocal · human."
    sup_en: "Core concept"
    sup_zh: "核心概念"
    source: "戴炜栋《新编简明英语语言学教程》Ch.1；胡壮麟《语言学教程》Ch.1"
    status: "已审核"
    x: 0.40
    y: 0.42

  - id: linguistics
    en: "Linguistics"
    zh: "语言学"
    module: core
    def_en: "Linguistics is the scientific study of language."
    def_zh: "语言学是对语言进行科学研究的学科。"
    example: "Guided by exhaustiveness, consistency and economy; observe → hypothesize → verify."
    sup_en: "Core concept"
    sup_zh: "核心概念"
    source: "戴炜栋《新编简明英语语言学教程》Ch.1；胡壮麟《语言学教程》Ch.1"
    status: "已审核"
    x: 0.40
    y: 0.72

  # ---------- 识别特征（5） ----------
  - id: arbitrariness
    en: "Arbitrariness"
    zh: "任意性"
    module: features
    def_en: "There is no natural connection between the linguistic sign (signifier) and what it refers to (signified)."
    def_zh: "能指与所指之间没有自然的、必然的联系（索绪尔）。"
    example: "Why is a dog called gǒu / dog / Hund? No reason — pure convention."
    sup_en: "Design features of language"
    sup_zh: "语言的识别特征"
    source: "Saussure, Course in General Linguistics (1916)；戴炜栋 Ch.1"
    debate_zh: "拟声词与象似性（iconicity）是常见的反例讨论；任意性在符号系统层面仍是主导原则。"
    status: "已审核"
    x: 0.16
    y: 0.16

  - id: duality
    en: "Duality"
    zh: "二重性"
    module: features
    def_en: "Language operates on two levels: meaningless sounds combine into meaningful units (double articulation)."
    def_zh: "无意义的语音层 × 有意义的符号层，双层结构效率极高。"
    example: "/k/+/æ/+/t/ are meaningless alone; together they make cat."
    sup_en: "Design features of language"
    sup_zh: "语言的识别特征"
    source: "Hockett (1960) design features；戴炜栋 Ch.1"
    status: "已审核"
    x: 0.30
    y: 0.10

  - id: creativity
    en: "Creativity"
    zh: "创造性"
    module: features
    def_en: "Finite means, infinite use: speakers can produce and understand sentences they have never heard before."
    def_zh: "有限的手段，无限的使用（递归造句）。"
    example: "You have never read this exact sentence before, yet you understand it."
    sup_en: "Design features of language"
    sup_zh: "语言的识别特征"
    source: "Chomsky 生成语法传统；Hockett (1960)；戴炜栋 Ch.1"
    debate_zh: "递归是否为人类语言独有受 Everett 皮拉罕语研究挑战；动物交际研究的边界仍有争论。"
    status: "已审核"
    x: 0.50
    y: 0.10

  - id: displacement
    en: "Displacement"
    zh: "移位性"
    module: features
    def_en: "Language can refer to things removed in time and space — past, future, distant, or imaginary."
    def_zh: "可以谈论不在此时此地的事物：过去、未来、虚构。"
    example: "We can talk about dinosaurs, next year's weather, or dragons."
    sup_en: "Design features of language"
    sup_zh: "语言的识别特征"
    source: "Hockett (1960) design features；戴炜栋 Ch.1"
    debate_zh: "蜜蜂舞蹈也具有有限的移位性，识别特征的「人类独有」边界存在争议。"
    status: "已审核"
    x: 0.64
    y: 0.16

  - id: cultural-transmission
    en: "Cultural Transmission"
    zh: "文化传递"
    module: features
    def_en: "Language is passed on by teaching and learning within a culture, not by biological inheritance."
    def_zh: "语言靠教与学在文化中传递，而不是靠基因遗传。"
    example: "A baby born in Beijing raised in London grows up speaking English."
    sup_en: "Design features of language"
    sup_zh: "语言的识别特征"
    source: "Hockett (1960) design features；戴炜栋 Ch.1"
    debate_zh: "与天赋论（innateness）的边界是 Nature vs Nurture 之争的一部分。"
    status: "已审核"
    x: 0.74
    y: 0.26

  # ---------- 功能（7） ----------
  - id: informative
    en: "Informative"
    zh: "信息功能"
    module: functions
    def_en: "Language is used to state facts and convey information — the major function of language."
    def_zh: "陈述事实、传递信息，是语言最主要的功能。"
    example: "\"Water boils at 100°C at sea level.\""
    sup_en: "Functions of language"
    sup_zh: "语言功能"
    source: "戴炜栋 Ch.1；Jakobson (1960) 交际功能框架"
    status: "已审核"
    x: 0.10
    y: 0.44

  - id: interpersonal
    en: "Interpersonal"
    zh: "人际功能"
    module: functions
    def_en: "Language establishes and maintains social relations and identities."
    def_zh: "建立并维持社会关系与身份。"
    example: "Choosing \"tu\" or \"vous\" signals closeness or distance."
    sup_en: "Functions of language"
    sup_zh: "语言功能"
    source: "戴炜栋 Ch.1；Halliday 元功能理论"
    status: "已审核"
    x: 0.13
    y: 0.56

  - id: performative
    en: "Performative"
    zh: "施为功能"
    module: functions
    def_en: "Saying is doing: certain utterances perform the act they describe."
    def_zh: "说话即做事。"
    example: "\"I hereby declare the meeting open.\" / \"I apologize.\""
    sup_en: "Functions of language"
    sup_zh: "语言功能"
    source: "Austin (1962) 言语行为理论；戴炜栋 Ch.1"
    status: "已审核"
    x: 0.16
    y: 0.68

  - id: emotive
    en: "Emotive"
    zh: "感情功能"
    module: functions
    def_en: "Language expresses the speaker's attitudes and emotions."
    def_zh: "表达说话者的态度与情绪。"
    example: "\"What a gorgeous sunset!\" / \"Ugh.\""
    sup_en: "Functions of language"
    sup_zh: "语言功能"
    source: "戴炜栋 Ch.1；Jakobson (1960) 交际功能框架"
    status: "已审核"
    x: 0.13
    y: 0.80

  - id: phatic
    en: "Phatic"
    zh: "寒暄功能"
    module: functions
    def_en: "Small talk that opens or maintains the channel of communication rather than exchanging information."
    def_zh: "不为信息，只为接通与维持关系。"
    example: "\"吃了吗？\" / \"Nice weather, isn't it?\""
    sup_en: "Functions of language"
    sup_zh: "语言功能"
    source: "Malinowski (1923) phatic communion；Jakobson (1960)"
    status: "已审核"
    x: 0.10
    y: 0.90

  - id: recreational
    en: "Recreational"
    zh: "娱乐功能"
    module: functions
    def_en: "Language used for sheer pleasure: poetry, jokes, wordplay."
    def_zh: "诗歌、段子、文字游戏——纯粹为了好玩的语言。"
    example: "Puns, limericks, and freestyle rap battles."
    sup_en: "Functions of language"
    sup_zh: "语言功能"
    source: "戴炜栋 Ch.1；Jakobson (1960) 诗性功能"
    status: "已审核"
    x: 0.20
    y: 0.94

  - id: metalingual
    en: "Metalingual"
    zh: "元语言功能"
    module: functions
    def_en: "Language used to talk about language itself — linguistics runs on it."
    def_zh: "用语言谈论语言——语言学本身就在使用这种功能。"
    example: "This very page is language describing language."
    sup_en: "Functions of language"
    sup_zh: "语言功能"
    source: "Jakobson (1960) 元语言功能；戴炜栋 Ch.1"
    status: "已审核"
    x: 0.30
    y: 0.90

  # ---------- 分支（10） ----------
  - id: phonetics
    en: "Phonetics"
    zh: "语音学"
    module: branches
    def_en: "The study of speech sounds: their physical properties and physiological production."
    def_zh: "研究语音的物理属性与生理发音过程。"
    example: "Measuring the formants of the vowel /iː/."
    sup_en: "Core branches of linguistics"
    sup_zh: "语言学核心分支"
    source: "戴炜栋 Ch.1/Ch.2；胡壮麟 Ch.1"
    status: "已审核"
    x: 0.60
    y: 0.56

  - id: phonology
    en: "Phonology"
    zh: "音系学"
    module: branches
    group: "Group 2"
    def_en: "The study of how sounds are organized and patterned within a language system."
    def_zh: "研究语音在语言系统中的组织与规律。"
    example: "Why /ŋ/ can end an English word (sing) but never begin one."
    sup_en: "Core branches of linguistics"
    sup_zh: "语言学核心分支"
    source: "戴炜栋 Ch.1/Ch.2；胡壮麟 Ch.1"
    status: "已审核"
    x: 0.68
    y: 0.64

  - id: morphology
    en: "Morphology"
    zh: "形态学"
    module: branches
    group: "Group 3"
    def_en: "The study of the internal structure of words and word-formation."
    def_zh: "研究词的内部结构与构词方式。"
    example: "un-happi-ness = prefix + root + suffix."
    sup_en: "Core branches of linguistics"
    sup_zh: "语言学核心分支"
    source: "戴炜栋 Ch.1/Ch.3；胡壮麟 Ch.1"
    status: "已审核"
    x: 0.76
    y: 0.74

  - id: syntax
    en: "Syntax"
    zh: "句法学"
    module: branches
    group: "Group 4"
    def_en: "The study of how words combine into phrases and sentences."
    def_zh: "研究词如何组合成短语与句子。"
    example: "\"Colorless green ideas sleep furiously\" is grammatical yet odd."
    sup_en: "Core branches of linguistics"
    sup_zh: "语言学核心分支"
    source: "戴炜栋 Ch.1/Ch.4；Chomsky, Syntactic Structures (1957)"
    status: "已审核"
    x: 0.84
    y: 0.84

  - id: semantics
    en: "Semantics"
    zh: "语义学"
    module: branches
    def_en: "The study of meaning encoded in language."
    def_zh: "研究语言编码的意义。"
    example: "Bachelor = unmarried + adult + male (componential analysis)."
    sup_en: "Core branches of linguistics"
    sup_zh: "语言学核心分支"
    source: "戴炜栋 Ch.1；胡壮麟 Ch.1"
    status: "已审核"
    x: 0.62
    y: 0.80

  - id: pragmatics
    en: "Pragmatics"
    zh: "语用学"
    module: branches
    def_en: "The study of meaning in context — what speakers mean beyond what they say."
    def_zh: "研究语境中的意义——言外之意。"
    example: "\"It's cold in here\" can be a request to close the window."
    sup_en: "Core branches of linguistics"
    sup_zh: "语言学核心分支"
    source: "戴炜栋 Ch.1；Austin (1962)；Grice (1975) 会话含义"
    status: "已审核"
    x: 0.72
    y: 0.90

  - id: sociolinguistics
    en: "Sociolinguistics"
    zh: "社会语言学"
    module: branches
    def_en: "The study of language in relation to society: class, region, identity, variation."
    def_zh: "研究语言与社会：阶层、地域、身份、变异。"
    example: "Why the same speaker says \"workin'\" with friends but \"working\" in an interview."
    sup_en: "Macrolinguistics"
    sup_zh: "宏观语言学（交叉分支）"
    source: "戴炜栋 Ch.1；Labov 变异社会语言学"
    status: "已审核"
    x: 0.86
    y: 0.60

  - id: psycholinguistics
    en: "Psycholinguistics"
    zh: "心理语言学"
    module: branches
    def_en: "The study of language in relation to the mind: acquisition, comprehension, production."
    def_zh: "研究语言与心智：习得、理解与产出。"
    example: "How do children acquire grammar so fast with so little input?"
    sup_en: "Macrolinguistics"
    sup_zh: "宏观语言学（交叉分支）"
    source: "戴炜栋 Ch.1"
    status: "已审核"
    x: 0.92
    y: 0.70

  - id: applied-linguistics
    en: "Applied Linguistics"
    zh: "应用语言学"
    module: branches
    def_en: "Applying linguistic theories to real-world problems, especially language teaching."
    def_zh: "把语言学理论应用于现实问题，尤其是语言教学。"
    example: "Designing a better English curriculum for Chinese learners."
    sup_en: "Macrolinguistics"
    sup_zh: "宏观语言学（交叉分支）"
    source: "戴炜栋 Ch.1"
    status: "已审核"
    x: 0.92
    y: 0.80

  - id: computational-linguistics
    en: "Computational Linguistics"
    zh: "计算语言学"
    module: branches
    def_en: "Modelling language with computational methods — from parsers to large language models."
    def_zh: "用计算方法建模语言——从句法分析器到大语言模型。"
    example: "This is the bridge to Part 3: can meaning live on a manifold?"
    sup_en: "Macrolinguistics"
    sup_zh: "宏观语言学（交叉分支）"
    source: "Jurafsky & Martin, Speech and Language Processing"
    status: "已审核"
    bridge: true
    x: 0.86
    y: 0.50

  # ---------- 六对区分（12） ----------
  # v3 布局：五列竖排对（上=左项/下=右项，VS 居中）+ 传统/现代一列在下方，
  # 让出 x=0.40 的纵向通道给 Language→Linguistics 核心轴，杜绝节点互压
  - id: prescriptive
    en: "Prescriptive"
    zh: "规定式"
    module: distinctions
    def_en: "Telling people how language ought to be used — laying down rules of correctness."
    def_zh: "规定语言「应该」怎样使用，裁定对错。"
    example: "\"Never end a sentence with a preposition!\""
    sup_en: "Key distinctions in linguistics"
    sup_zh: "语言学研究的重要区分"
    source: "戴炜栋 Ch.1"
    debate_zh: "语言教学场景中规定性仍有价值，二者并非绝对对立。"
    status: "已审核"
    x: 0.30
    y: 0.30

  - id: descriptive
    en: "Descriptive"
    zh: "描写式"
    module: distinctions
    def_en: "Describing and analyzing how language is actually used — linguistics is descriptive, not prescriptive."
    def_zh: "描写与分析语言实际的使用方式——语言学是描写的，不是规定的。"
    example: "Recording that many speakers say \"ain't\", and asking why."
    sup_en: "Key distinctions in linguistics"
    sup_zh: "语言学研究的重要区分"
    source: "戴炜栋 Ch.1"
    debate_zh: "描写立场不否认规范的存在，而是把规范本身也当作研究对象。"
    status: "已审核"
    x: 0.28
    y: 0.46

  - id: synchronic
    en: "Synchronic"
    zh: "共时"
    module: distinctions
    def_en: "Studying language at one particular point in time — a frozen slice."
    def_zh: "研究某一时刻的语言状态——时间切片。"
    example: "English as spoken in 2026."
    sup_en: "Key distinctions in linguistics"
    sup_zh: "语言学研究的重要区分"
    source: "Saussure, Course in General Linguistics (1916)"
    status: "已审核"
    x: 0.38
    y: 0.30

  - id: diachronic
    en: "Diachronic"
    zh: "历时"
    module: distinctions
    def_en: "Studying language as it changes and evolves through history."
    def_zh: "研究语言随历史的演变。"
    example: "Old English \"cniht\" → Modern English \"knight\"."
    sup_en: "Key distinctions in linguistics"
    sup_zh: "语言学研究的重要区分"
    source: "Saussure, Course in General Linguistics (1916)"
    status: "已审核"
    x: 0.38
    y: 0.42

  - id: langue
    en: "Langue"
    zh: "语言（系统）"
    module: distinctions
    def_en: "The abstract linguistic system shared by a speech community (Saussure)."
    def_zh: "言语社团共享的抽象语言系统（索绪尔）。"
    example: "The rules of chess — shared by all players."
    sup_en: "Key distinctions in linguistics"
    sup_zh: "语言学研究的重要区分"
    source: "Saussure, Course in General Linguistics (1916)"
    debate_zh: "被批评过于理想化、忽视语言变异；社会语言学提出异质语言观作为修正。"
    status: "已审核"
    x: 0.48
    y: 0.34

  - id: parole
    en: "Parole"
    zh: "言语（使用）"
    module: distinctions
    def_en: "The concrete, individual realization of language in actual use (Saussure)."
    def_zh: "个人在实际交际中对语言的具体运用（索绪尔）。"
    example: "One particular game of chess, move by move."
    sup_en: "Key distinctions in linguistics"
    sup_zh: "语言学研究的重要区分"
    source: "Saussure, Course in General Linguistics (1916)"
    status: "已审核"
    x: 0.48
    y: 0.46

  - id: competence
    en: "Competence"
    zh: "语言能力"
    module: distinctions
    def_en: "The ideal user's internalized knowledge of the rules of their language (Chomsky)."
    def_zh: "理想使用者内化于心的语言规则知识（乔姆斯基）。"
    example: "Knowing that \"the dog bit the man\" ≠ \"the man bit the dog\"."
    sup_en: "Key distinctions in linguistics"
    sup_zh: "语言学研究的重要区分"
    source: "Chomsky, Aspects of the Theory of Syntax (1965)"
    debate_zh: "与 langue 的对应并不严格；使用取向（usage-based）理论质疑天赋能力与使用的二分。"
    status: "已审核"
    x: 0.58
    y: 0.30

  - id: performance
    en: "Performance"
    zh: "语言运用"
    module: distinctions
    def_en: "The actual use of language in concrete situations, with slips and hesitations (Chomsky)."
    def_zh: "具体情境中的实际语言表现，含口误与迟疑（乔姆斯基）。"
    example: "What you actually said in yesterday's presentation — \"um\"s included."
    sup_en: "Key distinctions in linguistics"
    sup_zh: "语言学研究的重要区分"
    source: "Chomsky, Aspects of the Theory of Syntax (1965)"
    status: "已审核"
    x: 0.58
    y: 0.42

  - id: speech
    en: "Speech"
    zh: "口头语"
    module: distinctions
    def_en: "The primary, natural medium of language — speech came long before writing in history and in every child's development."
    def_zh: "语言的第一性载体——先有口语，后有文字。"
    example: "Kids shout \"mama\" years before they learn to write it."
    sup_en: "Key distinctions in linguistics"
    sup_zh: "语言学研究的重要区分"
    source: "戴炜栋 Ch.1"
    status: "已审核"
    x: 0.68
    y: 0.32

  - id: writing
    en: "Writing"
    zh: "书面语"
    module: distinctions
    def_en: "The secondary medium that records speech; modern linguistics prioritizes spoken data."
    def_zh: "记录口语的第二性载体；现代语言学以口语为主要研究对象。"
    example: "Writing systems appeared only ~5,000 years ago; speech is 100,000+."
    sup_en: "Key distinctions in linguistics"
    sup_zh: "语言学研究的重要区分"
    source: "戴炜栋 Ch.1"
    status: "已审核"
    x: 0.68
    y: 0.44

  - id: traditional-linguistics
    en: "Traditional Grammar"
    zh: "传统语法"
    module: distinctions
    def_en: "Prescriptive, Latin-based, focused on written language — the pre-modern tradition."
    def_zh: "规定式、依托拉丁语、偏重书面语——前现代的语言研究传统。"
    example: "Schoolroom rules like \"never split an infinitive\"."
    sup_en: "Key distinctions in linguistics"
    sup_zh: "语言学研究的重要区分"
    source: "戴炜栋 Ch.1"
    status: "已审核"
    x: 0.26
    y: 0.60

  - id: modern-linguistics
    en: "Modern Linguistics"
    zh: "现代语言学"
    module: distinctions
    def_en: "Descriptive, spoken-language-focused, aiming at a universal framework — the scientific turn."
    def_zh: "描写式、以口语为重点、追求普适框架——语言研究的科学转向。"
    example: "Corpus recordings of what people actually say."
    sup_en: "Key distinctions in linguistics"
    sup_zh: "语言学研究的重要区分"
    source: "戴炜栋 Ch.1；Saussure 以降的现代语言学传统"
    status: "已审核"
    x: 0.40
    y: 0.60

  # ---------- 理论人物（2） ----------
  - id: saussure
    en: "Ferdinand de Saussure"
    zh: "索绪尔"
    module: people
    def_en: "Father of modern linguistics; the sign is a union of signifier and signified, arbitrary by nature."
    def_zh: "现代语言学之父；符号是音响形象与概念的结合，其本质任意。"
    example: "Course in General Linguistics (1916)."
    sup_en: "Modern linguistics"
    sup_zh: "现代语言学（结构主义）"
    source: "Saussure, Course in General Linguistics (1916)"
    status: "已审核"
    x: 0.20
    y: 0.28

  - id: chomsky
    en: "Noam Chomsky"
    zh: "乔姆斯基"
    module: people
    def_en: "Founder of generative grammar; language is an innate faculty with recursive creativity."
    def_zh: "生成语法创始人；语言是天赋的心智能力，具有递归的创造性。"
    example: "Syntactic Structures (1957)."
    sup_en: "Generative grammar"
    sup_zh: "生成语法（理论流派）"
    source: "Chomsky, Syntactic Structures (1957)；Aspects (1965)"
    status: "已审核"
    x: 0.62
    y: 0.24

